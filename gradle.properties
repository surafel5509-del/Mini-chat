# MINI CHAT — Gradle configuration
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official
kotlin.incremental=true

# The publishable Supabase key ships with the app; secrets never do.
# Override locally via local.properties (git-ignored).

# AGP 9 compiles Kotlin itself ("built-in Kotlin"), but this project is built with the
# Kotlin Gradle Plugin so that KSP, Hilt and the Compose compiler keep a single, well
# documented pipeline. AGP 10 will drop the opt-out; migrating is a separate task.
android.builtInKotlin=false
android.newDsl=false
