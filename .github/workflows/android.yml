name: Android CI

on:
  push:
    branches: ['arena/8de85148-mini-chat']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" | tail -5
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.0'

      - name: Generate Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.9.0 --distribution-type bin || echo "wrapper generation failed"
          fi
          chmod +x gradlew || true
          touch build.log

      - name: Assemble debug APK
        id: build
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain > build.log 2>&1
          code=$?
          echo "gradle_exit=$code" >> "$GITHUB_OUTPUT"
          tail -n 200 build.log
          exit 0

      - name: Assemble release AAB + APK
        id: release_build
        if: steps.build.outputs.gradle_exit == '0'
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon --console=plain >> build.log 2>&1
          echo "gradle_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report status
        if: always()
        run: |
          {
            echo "debug_build_exit=${{ steps.build.outputs.gradle_exit }}"
            echo "release_build_exit=${{ steps.release_build.outputs.gradle_exit }}"
            echo "commit=${{ github.sha }}"
          } > build-status.txt

      - name: Publish build log to branch
        if: always()
        continue-on-error: true
        run: |
          touch build.log build-status.txt
          mkdir -p ci-logs
          cp build.log ci-logs/build.log 2>/dev/null || true
          cp build-status.txt ci-logs/build-status.txt 2>/dev/null || true
          git config user.name "mini-chat-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs gradle/wrapper gradlew gradlew.bat
          git commit -m "ci: build log [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash -q origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"

      - name: Publish log to issue (readable channel)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          api = f"https://api.github.com/repos/{repo}"

          def request(method, url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  url, data=data, method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "minichat-ci",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode() or "{}")

          log = ""
          for path in ("build.log", "ci-logs/build.log"):
              if os.path.exists(path):
                  log = open(path, encoding="utf-8", errors="replace").read()
                  break

          interesting = [
              line for line in log.splitlines()
              if re.search(r"^e: |FAILURE|What went wrong|Could not resolve|Could not find|BUILD SUCCESSFUL|BUILD FAILED|error:|> Task :app:|Caused by|^\* Exception|Unresolved reference|warning: ", line)
          ]
          selected = interesting[-260:] if interesting else log.splitlines()[-200:]
          body = "sha: `%s`\n\n```\n%s\n```" % (
              os.environ.get("GITHUB_SHA", "?")[:8],
              "\n".join(selected)[-60000:],
          )

          issues = request("GET", f"{api}/issues?state=all&per_page=20")
          target = next((i for i in issues if i.get("title") == "CI build log"), None)
          if target is None:
              target = request("POST", f"{api}/issues", {"title": "CI build log", "body": "Automated build log sink."})
          request("POST", f"{api}/issues/{target['number']}/comments", {"body": body})
          print("log published")
          PY
