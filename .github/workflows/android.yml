name: Android CI

on:
  push:
    branches: ['arena/8de85148-mini-chat']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" | tail -5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.0'

      - name: Generate Gradle wrapper
        continue-on-error: true
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.9.0 --distribution-type bin || echo "wrapper generation failed"
          fi
          chmod +x gradlew || true
          touch build.log

      - name: Assemble debug APK
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain > build.log 2>&1
          echo "gradle_exit=$?" > build-status.txt
          tail -n 120 build.log

      - name: Assemble release APK and AAB
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon --console=plain > release.log 2>&1
          echo "release_gradle_exit=$?" >> build-status.txt
          tail -n 60 release.log

      - name: Collect outputs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-logs/outputs
          cp app/build/outputs/apk/debug/*.apk ci-logs/outputs/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk ci-logs/outputs/ 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab ci-logs/outputs/ 2>/dev/null || true
          ls -lh ci-logs/outputs >> build-status.txt 2>/dev/null || true
          cat build-status.txt

      - name: Publish log to issue
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          log = ""
          for path in ("build.log", "release.log"):
              if os.path.exists(path):
                  log += "\n===== %s =====\n" % path + open(path, encoding="utf-8", errors="replace").read()

          signals = re.compile(r"^e: |FAILURE:|What went wrong|Could not resolve|Could not find|Unresolved reference"
                               r"|BUILD SUCCESSFUL|BUILD FAILED|error:|Caused by:|\* What went wrong|A problem occurred"
                               r"|> Task :app:.*(FAILED)?|APK|aab")
          interesting = [line for line in log.splitlines() if signals.search(line)]
          selected = interesting[-250:] if interesting else log.splitlines()[-120:]

          status = ""
          if os.path.exists("build-status.txt"):
              status = open("build-status.txt", encoding="utf-8", errors="replace").read()

          body = "sha `%s`\n\nstatus:\n```\n%s\n```\ncompile:\n```\n%s\n```" % (
              os.environ.get("GITHUB_SHA", "?")[:8],
              status[-1500:],
              "\n".join(selected)[-55000:],
          )
          open("/tmp/comment.md", "w", encoding="utf-8").write(body)
          PY
          gh issue comment 1 --repo "$REPO" --body-file /tmp/comment.md || echo "comment failed"

      - name: Push logs to branch
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          cp build.log ci-logs/build.log 2>/dev/null || true
          cp build-status.txt ci-logs/build-status.txt 2>/dev/null || true
          printf 'ci-logs/outputs/\nci-logs/*.log\n' > /dev/null
          git config user.name "mini-chat-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs/build.log ci-logs/build-status.txt ci-logs/outputs gradle/wrapper gradlew gradlew.bat 2>/dev/null || true
          git commit -m "ci: build log [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed"
