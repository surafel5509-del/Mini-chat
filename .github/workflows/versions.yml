name: Version Discovery
on:
  workflow_dispatch:
  push:
    branches: ['arena/8de85148-mini-chat']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gather reference
        continue-on-error: true
        run: |
          set +e
          {
          curl -sL --max-time 90 https://codeload.github.com/supabase-community/supabase-kt/tar.gz/refs/tags/3.9.0 -o /tmp/sk.tar.gz
          mkdir -p /tmp/sk && tar xzf /tmp/sk.tar.gz -C /tmp/sk --strip-components=1
          SK=/tmp/sk
          echo "########## gradle wrapper + android demo build"
          cat $SK/gradle/wrapper/gradle-wrapper.properties
          cat $SK/demos/android-login/build.gradle.kts 2>/dev/null | head -40
          cat $SK/demos/android-login/settings.gradle.kts 2>/dev/null | head -40
          cat $SK/demos/android-login/buildSrc/src/main/kotlin/Versions.kt
          find $SK/demos/android-login -name "build.gradle.kts" | head
          echo "--- android module build file"
          cat $SK/demos/android-login/android/build.gradle.kts
          echo "########## AuthConfig"
          cat $(find $SK/Auth/src -name "AuthConfig.kt" | head -1)
          echo "########## PostgrestQueryBuilder"
          cat $SK/Postgrest/src/commonMain/kotlin/io/github/jan/supabase/postgrest/query/PostgrestQueryBuilder.kt
          echo "########## PostgrestRequestBuilder"
          sed -n '1,120p' $SK/Postgrest/src/commonMain/kotlin/io/github/jan/supabase/postgrest/query/PostgrestRequestBuilder.kt
          echo "########## filters"
          ls $SK/Postgrest/src/commonMain/kotlin/io/github/jan/supabase/postgrest/query/filter
          sed -n '1,80p' $SK/Postgrest/src/commonMain/kotlin/io/github/jan/supabase/postgrest/query/filter/PostgrestFilterBuilder.kt
          echo "########## decode extensions"
          grep -rn "decodeSingle\|decodeList\|decodeSingleOrNull" $SK/Postgrest/src/commonMain --include=*.kt | head -20
          echo "########## Request functions (select/insert/update/delete/upsert)"
          grep -rn "suspend inline fun \|suspend fun " $SK/Postgrest/src/commonMain/kotlin/io/github/jan/supabase/postgrest/query/request/*.kt | head -40
          echo "########## Storage api files"
          find $SK/Storage/src/commonMain -name "*.kt" | head -30
          grep -rn "suspend fun upload\|fun publicUrl\|suspend fun delete\|suspend fun update\|suspend fun createSignedUrl\|suspend fun downloadPublic" $SK/Storage/src/commonMain --include=*.kt | head -30
          echo "########## Storage BucketApi signature"
          sed -n '1,120p' $(find $SK/Storage/src/commonMain -name "BucketApi.kt" | head -1)
          echo "########## Postgrest rpc"
          grep -rn "suspend inline fun <reified T : Any> rpc\|suspend fun rpc" $SK/Postgrest/src/commonMain --include=*.kt | head -10
          } > versions.txt 2>&1
      - name: Publish logs to branch
        if: always()
        run: |
          mkdir -p ci-logs
          cp versions.txt ci-logs/versions.txt 2>/dev/null || true
          git config user.name "mini-chat-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "ci: publish logs [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin arena/8de85148-mini-chat || true
          git push origin HEAD:arena/8de85148-mini-chat
