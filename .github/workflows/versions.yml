name: Version Discovery
on:
  workflow_dispatch:
  push:
    branches: ['arena/8de85148-mini-chat']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gather reference
        continue-on-error: true
        run: |
          set +e
          {
          curl -sL --max-time 90 https://codeload.github.com/supabase-community/supabase-kt/tar.gz/refs/tags/3.9.0 -o /tmp/sk.tar.gz
          mkdir -p /tmp/sk && tar xzf /tmp/sk.tar.gz -C /tmp/sk --strip-components=1
          SK=/tmp/sk
          echo "########## Auth plugin object + config"
          sed -n '1,140p' $SK/Auth/src/commonMain/kotlin/io/github/jan/supabase/auth/Auth.kt
          echo "########## MinimalConfig"
          cat $SK/Auth/src/commonMain/kotlin/io/github/jan/supabase/auth/MinimalConfig.kt
          echo "########## SessionManager"
          find $SK -name "SessionManager*.kt" -o -name "*SessionManager.kt" | head
          cat $(find $SK -name "SessionManager.kt" | head -1)
          echo "########## SessionStatus"
          cat $SK/Auth/src/commonMain/kotlin/io/github/jan/supabase/auth/status/SessionStatus.kt
          echo "########## Email provider"
          sed -n '1,80p' $SK/Auth/src/commonMain/kotlin/io/github/jan/supabase/auth/providers/builtin/Email.kt 2>/dev/null || find $SK/Auth -name "Email.kt"
          echo "########## realtime usage in tests"
          grep -rn "postgresChangeFlow\|broadcastFlow\|presenceFlow\|presenceChangeFlow\|\.subscribe(\|channel\.track\|channel(" $SK/integration-test $SK/Realtime/src --include=*.kt | head -50
          echo "########## Realtime plugin config"
          sed -n '1,80p' $SK/Realtime/src/commonMain/kotlin/io/github/jan/supabase/realtime/Realtime.kt
          echo "########## RealtimeChannelBuilder"
          cat $(find $SK/Realtime/src -name "RealtimeChannelBuilder.kt" | head -1)
          echo "########## Storage bucket api"
          grep -rn "public suspend fun \|public fun " $SK/Storage/src/commonMain/kotlin/io/github/jan/supabase/storage/BucketApi.kt | head -40
          echo "########## Postgrest query builder"
          grep -rn "public suspend fun \|public fun " $SK/Postgrest/src/commonMain/kotlin/io/github/jan/supabase/postgrest/query/PostgrestQueryBuilder.kt | head -40
          echo "########## Postgrest filters/order/limit"
          ls $SK/Postgrest/src/commonMain/kotlin/io/github/jan/supabase/postgrest/query/
          grep -rn "suspend inline fun <reified T : Any> decodeSingle\|suspend inline fun <reified T : Any> decodeList\|class PostgrestResult" $SK/Postgrest/src/commonMain -r | head -20
          echo "########## createSupabaseClient"
          grep -rn "fun createSupabaseClient" $SK/Supabase/src --include=*.kt -A 12 | head -60
          echo "########## bom artifacts"
          cat $SK/bom/build.gradle.kts | head -50
          echo "########## auth-kt build deps (to know ktor engine need)"
          cat $SK/Auth/build.gradle.kts | head -60
          } > versions.txt 2>&1
      - name: Publish logs to branch
        if: always()
        run: |
          mkdir -p ci-logs
          cp versions.txt ci-logs/versions.txt 2>/dev/null || true
          git config user.name "mini-chat-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "ci: publish logs [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin arena/8de85148-mini-chat || true
          git push origin HEAD:arena/8de85148-mini-chat
