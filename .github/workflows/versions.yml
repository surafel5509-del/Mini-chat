name: Version Discovery
on:
  workflow_dispatch:
  push:
    branches: ['arena/8de85148-mini-chat']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gather reference
        continue-on-error: true
        run: |
          set +e
          {
          curl -sL --max-time 90 https://codeload.github.com/supabase-community/supabase-kt/tar.gz/refs/tags/3.9.0 -o /tmp/sk.tar.gz
          mkdir -p /tmp/sk && tar xzf /tmp/sk.tar.gz -C /tmp/sk --strip-components=1
          SK=/tmp/sk
          echo "########## MIGRATION.md (2.x -> 3.x)"
          sed -n '1,200p' $SK/MIGRATION.md
          echo "########## android demo supabase module + viewmodel"
          cat $SK/demos/android-login/common/src/commonMain/kotlin/io/github/jan/supabase/common/di/supabaseModule.kt
          cat $SK/demos/android-login/common/src/commonMain/kotlin/io/github/jan/supabase/common/AppViewModel.kt
          cat $SK/demos/android-login/common/src/commonMain/kotlin/io/github/jan/supabase/common/di/viewModelModule.kt
          echo "########## chat-demo files"
          find $SK/sample/chat-demo-mpp -name "*.kt" | head -40
          echo "########## chat-demo realtime usage"
          grep -rn "channel\|postgresChangeFlow\|broadcastFlow\|presenceFlow\|subscribe\|track(" $SK/sample/chat-demo-mpp --include=*.kt | head -60
          echo "########## Auth public api"
          grep -rn "    suspend fun \|    fun \|    val " $SK/Auth/src/commonMain/kotlin/io/github/jan/supabase/auth/Auth.kt | head -80
          echo "########## Auth plugin config"
          find $SK/Auth/src/commonMain -name "*.kt" | head -40
          echo "########## GoTrue extension funcs"
          grep -rn "public suspend fun \|public fun " $SK/GoTrue/src/commonMain --include=*.kt | head -80
          echo "########## Realtime channel builder"
          find $SK/Realtime/src -name "*.kt" | head -40
          grep -rn "public fun \|public suspend fun " $SK/Realtime/src/commonMain --include=*.kt | head -120
          echo "########## Storage api"
          grep -rn "public suspend fun \|public fun " $SK/Storage/src/commonMain --include=*.kt | head -60
          echo "########## Postgrest api"
          grep -rn "public suspend fun \|public fun \|suspend inline fun " $SK/Postgrest/src/commonMain/kotlin/io/github/jan/supabase/postgrest/query/PostgrestQueryBuilder.kt | head -40
          grep -rn "decodeSingle\|decodeList\|select\|upsert" $SK/Postgrest/src/commonMain -r --include=*.kt | head -40
          echo "########## createSupabaseClient"
          grep -rn "fun createSupabaseClient" $SK/Supabase/src --include=*.kt
          echo "########## bom contents"
          cat $SK/bom/build.gradle.kts | head -60
          } > versions.txt 2>&1
      - name: Publish logs to branch
        if: always()
        run: |
          mkdir -p ci-logs
          cp versions.txt ci-logs/versions.txt 2>/dev/null || true
          git config user.name "mini-chat-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "ci: publish logs [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin arena/8de85148-mini-chat || true
          git push origin HEAD:arena/8de85148-mini-chat
