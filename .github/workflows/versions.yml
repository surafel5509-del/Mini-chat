name: Version Discovery
on:
  workflow_dispatch:
  push:
    branches: ['arena/8de85148-mini-chat']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gather reference
        continue-on-error: true
        run: |
          set +e
          {
          C=https://repo1.maven.org/maven2
          G=https://dl.google.com/dl/android/maven2
          q() {
            local base="$1" path="$2"
            local code
            code=$(curl -sS -o /tmp/meta.xml -w '%{http_code}' --max-time 30 "$base/$path/maven-metadata.xml")
            echo "=== $path -> HTTP $code"
            sed -e 's/></>\n</g' /tmp/meta.xml | grep -oE '<version>[^<]+' | sed -e 's/<version>//' | tail -25 | tr '\n' ' '
            echo
          }
          q $G com/android/tools/build/gradle
          q $C org/jetbrains/kotlin/kotlin-gradle-plugin
          q $C com/google/devtools/ksp/symbol-processing-gradle-plugin
          q $C io/ktor/ktor-client-okhttp
          q $C io/ktor/ktor-client-core
          q $G androidx/compose/compose-bom
          q $G androidx/compose/material3/material3
          q $G androidx/navigation/navigation-compose
          q $G androidx/core/core-splashscreen
          q $G androidx/datastore/datastore-preferences
          echo "=== supabase-kt 3.9.0 repo"
          curl -sL --max-time 90 https://codeload.github.com/supabase-community/supabase-kt/tar.gz/refs/tags/3.9.0 -o /tmp/sk.tar.gz
          mkdir -p /tmp/sk && tar xzf /tmp/sk.tar.gz -C /tmp/sk --strip-components=1
          echo "--- top dirs"; ls /tmp/sk
          echo "--- modules"; ls /tmp/sk/*/ -d 2>/dev/null | head -30
          echo "--- versions toml (supabase deps)"; sed -n '1,120p' /tmp/sk/gradle/libs.versions.toml
          echo "--- demo projects"; find /tmp/sk -maxdepth 3 -type d -name "*demo*" -o -maxdepth 3 -type d -name "*sample*" | head -20
          echo "--- kotlin files in demos"; find /tmp/sk -path "*demo*" -name "*.kt" | head -60
          } > versions.txt 2>&1
      - name: Publish logs to branch
        if: always()
        run: |
          mkdir -p ci-logs
          cp versions.txt ci-logs/versions.txt 2>/dev/null || true
          git config user.name "mini-chat-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "ci: publish logs [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin arena/8de85148-mini-chat || true
          git push origin HEAD:arena/8de85148-mini-chat
