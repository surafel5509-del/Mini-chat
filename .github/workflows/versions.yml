name: Version Discovery
on:
  workflow_dispatch:
  push:
    branches: ['arena/8de85148-mini-chat']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query metadata
        continue-on-error: true
        run: |
          {
          q() {
            local base="$1" path="$2"
            local url="$base/$path/maven-metadata.xml"
            local code
            code=$(curl -sS -o /tmp/meta.xml -w '%{http_code}' --max-time 30 "$url")
            echo "=== $path -> HTTP $code  ($(wc -c </tmp/meta.xml) bytes)"
            sed -e 's/></>\n</g' /tmp/meta.xml | grep -oE '<version>[^<]+' | sed -e 's/<version>//' -e 's/<\/version>//' | tail -12 | tr '\n' ' '
            echo
          }
          C=https://repo1.maven.org/maven2
          G=https://dl.google.com/dl/android/maven2
          q $C io/github/jan-tennert/supabase/postgrest-kt
          q $C io/github/jan-tennert/supabase/supabase-kt
          q $C com/google/dagger/hilt-android
          q $C com/google/devtools/ksp/symbol-processing-gradle-plugin
          q $C io/coil-kt/coil-compose
          q $C org/jetbrains/kotlinx/kotlinx-serialization-json
          q $C org/jetbrains/kotlin/kotlin-gradle-plugin
          q $C com/android/tools/build/gradle
          q $G androidx/compose/compose-bom
          q $G androidx/navigation/navigation-compose
          q $G androidx/activity/activity-compose
          q $G androidx/core/core-ktx
          q $G androidx/lifecycle/lifecycle-runtime-compose
          q $G androidx/datastore/datastore-preferences
          q $G androidx/hilt/hilt-navigation-compose
          q $G androidx/splashscreen/splashscreen
          q $G com/google/gms/google-services
          q $G com/google/firebase/firebase-bom
          q $G androidx/security/security-crypto
          } > versions.txt 2>&1
      - name: Publish logs to branch
        if: always()
        run: |
          mkdir -p ci-logs
          cp versions.txt ci-logs/versions.txt 2>/dev/null || true
          git config user.name "mini-chat-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "ci: publish logs [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin arena/8de85148-mini-chat || true
          git push origin HEAD:arena/8de85148-mini-chat
